name: Deploy to staging

# Deploys the child theme to SiteGround staging on every push to main.
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SG_SSH_KEY    private key whose public half is added in SiteGround
#                 Site Tools > Devs > SSH Keys Manager
#   SG_HOST       SSH host shown in the SSH Keys Manager
#   SG_USER       SSH username
#   SG_PORT       SSH port (SiteGround uses 18765)
#   SG_THEME_PATH full path of the theme folder on the server, e.g.
#                 ~/www/staging20.aaronz.co/public_html/wp-content/themes/homeo-child
#   SG_WP_PATH    WordPress root of the staging site (for cache purge)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SG_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SG_PORT }}" "${{ secrets.SG_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload theme files
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'README*' \
            -e "ssh -i ~/.ssh/id_deploy -p ${{ secrets.SG_PORT }}" \
            ./ "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}:${{ secrets.SG_THEME_PATH }}/"

      - name: Purge SiteGround cache
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.SG_PORT }}" \
            "${{ secrets.SG_USER }}@${{ secrets.SG_HOST }}" \
            "cd ${{ secrets.SG_WP_PATH }} && wp sg purge"
